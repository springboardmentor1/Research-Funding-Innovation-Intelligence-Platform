services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfip_user
      POSTGRES_PASSWORD: rfip_pass
      POSTGRES_DB: rfip_db
    ports:
      - "5432:5432"
    volumes:
      - rfip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfip_user -d rfip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - rfip_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rfip_user:rfip_pass@db:5432/rfip_db
      MONGO_URL: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  rfip_postgres_data:
  rfip_mongo_data:
