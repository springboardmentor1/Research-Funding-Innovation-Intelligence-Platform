name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: innovation_user
          POSTGRES_PASSWORD: innovation_pass
          POSTGRES_DB: innovation_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innovation_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://innovation_user:innovation_pass@localhost:5432/innovation_platform_test
          MONGO_URI: "mongodb://localhost:27017/?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000"
          SECRET_KEY: ci-test-secret-key
        run: pytest --cov=app --cov-report=term-missing -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t innovation-platform-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t innovation-platform-frontend:ci ./frontend
