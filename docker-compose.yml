version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: innovation_platform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Set any password you prefer here
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: innovation_platform
    ports:
      - "5432:5432"
    volumes:
      # This volume persists your database data on your computer so it doesn't get lost when the container stops
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
