version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: research-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/test.db:/app/test.db
      - ./backend/database:/app/database
      # In a real production scenario, use a managed database instead of SQLite volumes
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
