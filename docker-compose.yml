version: '3.8'

services:
  # ── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfiip-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://rfiip:rfiip_secret@db:5432/research_platform}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rfiip-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (React + Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfiip-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rfiip-network
    restart: unless-stopped

  # ── PostgreSQL (Production Database) ────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rfiip-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rfiip}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rfiip_secret}
      - POSTGRES_DB=${POSTGRES_DB:-research_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rfiip-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfiip"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-data:
  postgres-data:

networks:
  rfiip-network:
    driver: bridge
