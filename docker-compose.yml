version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rfi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rfi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfi_password}
      POSTGRES_DB: ${POSTGRES_DB:-rfi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfi_user} -d ${POSTGRES_DB:-rfi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: rfi_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfi_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rfi_user}:${POSTGRES_PASSWORD:-rfi_password}@postgres:5432/${POSTGRES_DB:-rfi_db}
      - MONGODB_URL=mongodb://${MONGO_USER:-mongo_admin}:${MONGO_PASSWORD:-mongo_password}@mongodb:27017/
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfi_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:
