services:
  postgres:
    image: postgres:16-alpine
    container_name: innovation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innovation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innovation_pass}
      POSTGRES_DB: ${POSTGRES_DB:-innovation_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innovation_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovation_network

  mongo:
    image: mongo:7
    container_name: innovation_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovation_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innovation_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      UPLOAD_ROOT: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - innovation_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: innovation_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - innovation_network

volumes:
  postgres_data:
  mongo_data:
  uploads_data:

networks:
  innovation_network:
    driver: bridge
